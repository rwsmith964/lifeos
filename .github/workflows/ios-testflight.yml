name: iOS TestFlight build

# Builds the signed iOS app on a macOS GitHub runner and uploads it to App
# Store Connect (TestFlight). No Mac needed: signing is handled by Xcode's
# automatic signing using an App Store Connect API key, which lets the runner
# create and fetch the certificate and provisioning profile itself.
#
# One-time setup (done by the account holder, never by an assistant):
#   1. App Store Connect > Users and Access > Integrations > App Store Connect
#      API > generate a key with the "App Manager" role. Download the .p8 once.
#   2. In this repo: Settings > Secrets and variables > Actions, add
#        ASC_KEY_ID      (the key's ID)
#        ASC_ISSUER_ID   (the Issuer ID shown above the keys list)
#        ASC_KEY_P8      (the full text of the .p8 file, including the
#                         BEGIN/END PRIVATE KEY lines)
#   3. Run this workflow manually (Actions > iOS TestFlight build > Run).
#
# The Team ID is not a secret (it appears in every signed app).

on:
  workflow_dispatch: {}

env:
  TEAM_ID: H2G78ZJA42
  BUNDLE_ID: com.rwsmith.lifeos

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor native projects
        run: npx cap sync ios

      - name: Check the signing secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "Missing secret $name. See the setup notes at the top of this file."; exit 1; fi
          done

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # Rebuild a clean PEM file from whatever was pasted into the secret: a
          # paste can lose its line breaks, gain Windows line endings or stray
          # spaces, and Apple's parser rejects all of those. Only the base64 body
          # is kept, re-wrapped at 64 characters between the standard header and footer.
          BODY=$(printf '%s' "$ASC_KEY_P8" | sed -e 's/-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----//' | tr -d '[:space:]')
          if [ -z "$BODY" ]; then echo "ASC_KEY_P8 is empty after cleaning: re-paste the whole key file into the secret."; exit 1; fi
          {
            echo "-----BEGIN PRIVATE KEY-----"
            printf '%s' "$BODY" | fold -w 64
            echo
            echo "-----END PRIVATE KEY-----"
          } > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          # Safe diagnostics only (no key material): size and the shape of the file.
          echo "Key file lines: $(wc -l < "$KEY_FILE"), body characters: ${#BODY}"
          head -1 "$KEY_FILE"
          tail -1 "$KEY_FILE"

      # Build WITHOUT signing. An unsigned archive needs no registered test devices;
      # the export step below signs it with Apple's distribution certificate and
      # an App Store provisioning profile that Xcode creates on its own through the
      # API key. (Letting the archive step sign would ask for a development profile,
      # which needs a registered iPhone.)
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Famwise.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>upload</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Famwise.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
