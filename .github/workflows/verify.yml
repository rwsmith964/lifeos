name: Verify

# Runs the same four gates a human is expected to run before committing
# (typecheck, lint, test, build — see the standing workflow in AGENTS.md /
# DECISIONS.md) on every push to main and every PR, so a broken gate is
# caught in review instead of discovered after merge. D-146 added the first
# two required env vars below; see that decision for why REQUIRE_* is set
# to "1" here specifically.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders only — neither REQUIRE_* guard makes a network call,
      # it only checks that the var is *set* (scripts/check-ai-config.mjs,
      # scripts/check-cron-config.mjs), so no real secret is needed in CI.
      # Do not put a real key here.
      ANTHROPIC_API_KEY: placeholder-ci-value
      CRON_SECRET: placeholder-ci-value
      REQUIRE_ANTHROPIC_KEY: "1"
      REQUIRE_CRON_SECRET: "1"
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # supabase/tests/pglite/**/*.test.ts (vitest.config.ts) runs against
      # an in-process pglite instance, not a real Postgres/Supabase project
      # — no service container or DB setup step is needed for `pnpm test`
      # to exercise the RLS test suite here.

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      # AI_TEST_MODE=1 swaps lib/ai/client.ts's Anthropic calls for the fixed
      # fixtures in lib/ai/test-fixtures.ts, so the specs get deterministic
      # AI output without a real API key. It is set ONLY here, never in
      # Vercel/production (see D-148 comment in lib/ai/client.ts).
      AI_TEST_MODE: "1"
      ANTHROPIC_API_KEY: placeholder-ci-value
      CRON_SECRET: placeholder-ci-value
      REQUIRE_ANTHROPIC_KEY: "1"
      REQUIRE_CRON_SECRET: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations + supabase/seed.sql)
        run: supabase start

      - name: Export local Supabase connection env vars
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            >> "$GITHUB_ENV"

      - name: Reset database and re-apply migrations + supabase/seed.sql
        run: supabase db reset

      # supabase/seed-e2e.sql layers the Jones household on top of the
      # regular seed.sql Smith household — see e2e/household-isolation.spec.ts
      # (spec 6). It is never applied to production; only this CI job and a
      # local `supabase db reset` a developer runs by hand touch it.
      - name: Apply E2E-only seed data (Jones household, D-148 spec 6)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/seed-e2e.sql

      - name: Build app (AI_TEST_MODE=1)
        run: pnpm build

      - name: Start app on port 3100
        run: |
          pnpm exec next start -p 3100 > /tmp/next-start.log 2>&1 &
          echo $! > /tmp/next-start.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/api/health > /dev/null; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time." >&2
          cat /tmp/next-start.log
          exit 1

      - name: Run Playwright E2E suite
        run: pnpm exec playwright test

      - name: Stop app
        if: always()
        run: kill "$(cat /tmp/next-start.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
