name: iOS simulator build

# Verifies the Capacitor iOS project actually builds, using a macOS GitHub
# Actions runner (Xcode isn't available on Linux, and Richard's own machine
# is Windows — see APP-STORE-PLAN.md §5). This is a *simulator* build only:
# no signing certificate or provisioning profile is required, so it needs
# no Apple Developer account and does not produce an App Store-uploadable
# artifact. Its only job is to catch iOS build breakage (Swift errors,
# CocoaPods/SPM resolution failures, Capacitor plugin issues) on every push,
# well before an Apple Developer account or real device is involved.
#
# Once Richard has enrolled in the Apple Developer Program (§6) and set up
# a signing certificate + provisioning profile (§8), this workflow can be
# extended with a signed `xcodebuild archive` step and a fastlane TestFlight
# upload — see APP-STORE-PLAN.md §5 for the recommended next step.

on:
  push:
    branches: [main, capacitor-app-store-prep]
    paths:
      - "ios/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "capacitor.config.ts"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch: {}

jobs:
  build-simulator:
    # macos-15, not macos-14: macos-14 (Sonoma) is being deprecated by
    # GitHub and its Xcode lineup tops out around 16.x, which is too old
    # for Capacitor 8's prebuilt Capacitor.xcframework (compiled with a
    # newer Swift ABI) - building against it silently resolves to a
    # mismatched module interface and fails with misleading "has no
    # member" errors on APIs that do exist (e.g. CAPPluginCall.reject).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's "packageManager" field;
      # passing `version:` here too causes pnpm/action-setup to fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Select Xcode version
        # Capacitor 8's prebuilt xcframework needs a current Xcode - pin
        # the newest one installed on the macos-15 image rather than the
        # default (older) Xcode, and rather than an old hardcoded version
        # that will eventually vanish from the runner image entirely.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        working-directory: ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      - name: Build for iOS Simulator (Debug, unsigned)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO
